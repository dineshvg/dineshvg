name: Refresh profile

# Daily: rebuild the 3D contribution city and the dashboard stats.
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "assets/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/fetch_stats.py "${{ github.repository_owner }}" > build/stats.json

      - name: Build SVGs
        run: python build/build.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib svg build/stats.json
          git diff --cached --quiet || (git commit -m "chore: refresh profile" && git push)
